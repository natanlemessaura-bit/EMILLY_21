<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Emilly ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:#050505;
overflow:hidden;
height:100vh;

display:flex;
justify-content:center;
align-items:center;

color:white;

}

/* ESTRELAS */

.stars{
position:fixed;
width:100%;
height:100%;
overflow:hidden;
top:0;
left:0;
z-index:-1;
}

.star{

position:absolute;
width:2px;
height:2px;

background:white;

border-radius:50%;

animation:piscar 2s infinite alternate;

}

@keyframes piscar{

from{opacity:.2;}

to{opacity:1;}

}

.container{

width:90%;
max-width:700px;

padding:40px;

background:rgba(20,20,20,.92);

border-radius:20px;

text-align:center;

box-shadow:0 0 40px rgba(255,255,255,.08);

backdrop-filter:blur(6px);

}

.lock{

font-size:90px;

margin-bottom:20px;

transition:.6s;

}

input{

width:100%;

padding:15px;

margin-top:25px;

margin-bottom:20px;

font-size:18px;

border-radius:10px;

border:none;

text-align:center;

}

button{

padding:15px 35px;

font-size:18px;

border:none;

border-radius:10px;

background:#ff4f81;

color:white;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:scale(1.08);

}

#erro{

margin-top:20px;

color:#ff9090;

font-weight:bold;

}

#conteudo{

display:none;

animation:fade 1.5s;

overflow-y:auto;

max-height:80vh;

text-align:left;

}

img{

width:100%;

border-radius:15px;

margin-top:25px;

}

@keyframes fade{

from{

opacity:0;
transform:translateY(20px);

}

to{

opacity:1;
transform:translateY(0);

}

}

</style>
</head>

<body>

<div class="stars" id="stars"></div>

<div class="container">

<div id="login">

<div class="lock" id="cadeado">🔒</div>

<h2>Para Emilly</h2>

<p style="margin-top:20px;">
Insira a senha de 9 letras.
</p>

<input
id="senha"
type="password"
placeholder="Senha">

<button onclick="entrar()">

❤️ Revelar meu presente

</button>

<p id="erro"></p>

</div>

<div id="conteudo">

<h1 style="text-align:center;">
❤️ Feliz Aniversário ❤️
</h1>

<p style="margin-top:25px;line-height:1.8;">

ESCREVA SUA CARTA AQUI.

</p>

<img src="montagem.png">

</div>

</div>

<script>

// cria estrelas

for(let i=0;i<180;i++){

let star=document.createElement("div");

star.className="star";

star.style.left=Math.random()*100+"%";

star.style.top=Math.random()*100+"%";

star.style.animationDelay=Math.random()*3+"s";

star.style.opacity=Math.random();

document.getElementById("stars").appendChild(star);

}

function entrar(){

let senha=document
.getElementById("senha")
.value
.toUpperCase()
.trim();

if(senha==="EMILLYNDA"){

document.getElementById("erro").innerHTML="";

document.getElementById("cadeado").innerHTML="🔓";

setTimeout(function(){

document.getElementById("login").style.display="none";

document.body.style.transition="1s";

document.body.style.background="#000";

document.getElementById("conteudo").style.display="block";

},1000);

}else{

document.getElementById("erro").innerHTML="Ainda não... ❤️";

}

}

</script>

</body>
</html>
